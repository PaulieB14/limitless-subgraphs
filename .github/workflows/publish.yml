name: Publish MCP to npm + ClawHub

# Mirrors the working setup in PaulieB14/graph-aave-mcp. Requires two repo
# secrets before it can do anything: NPM_TOKEN (granular, read+write on
# graph-limitless-mcp) and CLAWHUB_TOKEN. Without them the job runs and fails
# loudly rather than silently skipping.
#
# The MCP lives in mcp-server/, not the repo root, so every step runs there.
# The root package is the subgraph workspace and is not published.

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mcp-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the docs match the registered tools
        # The README and SKILL.md once listed 12 tools of which 9 did not exist,
        # while 16 real ones went undocumented — and SKILL.md is what ClawHub
        # publishes, so the listing advertised an API that failed on first call.
        # This makes that class of drift a build failure instead of a discovery.
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("src/index.ts", "utf8");
            const real = new Set([...src.matchAll(/registerTool\(\s*"([a-z0-9_]+)"/g)].map(m => m[1]));
            let bad = false;
            for (const f of ["README.md", "SKILL.md"]) {
              const doc = new Set([...fs.readFileSync(f, "utf8")
                .matchAll(/`((?:get|search|query|compare)_[a-z_]+)`/g)].map(m => m[1]));
              const phantom = [...doc].filter(t => !real.has(t));
              const missing = [...real].filter(t => !doc.has(t));
              if (phantom.length) { console.error(`${f}: documents non-existent tools: ${phantom.join(", ")}`); bad = true; }
              if (missing.length) { console.error(`${f}: does not document: ${missing.join(", ")}`); bad = true; }
            }
            if (bad) process.exit(1);
            console.log(`docs match all ${real.size} registered tools`);
          '

      - name: Publish to npm
        id: npm_publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # Idempotent: the version in package.json is the intent. If it is
          # already on the registry there is nothing to do, and that is success
          # — not a failure to be retried, and not a reason to auto-bump. A
          # blind `npm version patch` on every push would inflate the version
          # for README-only commits and drift from the tags.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — nothing to do."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          npm publish --access public

      - name: Publish to ClawHub (skill / discovery listing)
        id: clawhub_publish
        continue-on-error: true
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes clawhub@latest login --no-input --token "$CLAWHUB_TOKEN"
          # Idempotent, same reasoning as the npm step: ClawHub rejects a
          # re-publish of an existing version, which is not a failure — the
          # version is simply already there.
          #
          # `inspect` is the command that reports it. (`skill info` does not
          # exist; the skill subcommand only has publish/rename/merge. An
          # earlier version of this workflow invented it, so the check silently
          # never matched and every run attempted a doomed re-publish.)
          if npx --yes clawhub@latest inspect graph-limitless-mcp 2>/dev/null | grep -qE "^Latest: +$VERSION\\b"; then
            echo "graph-limitless-mcp@$VERSION is already on ClawHub — nothing to do."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Publishing graph-limitless-mcp v$VERSION to ClawHub"
          # Publish from a clean folder holding only SKILL.md: a package.json
          # with a bin field makes the CLI treat this as a code-plugin, which is
          # wrong for an MCP server (it runs outside OpenClaw, not as a plugin).
          PUBLISH_DIR=$(mktemp -d)
          cp SKILL.md "$PUBLISH_DIR/SKILL.md"
          sed -i.bak "s/^version:.*/version: $VERSION/" "$PUBLISH_DIR/SKILL.md"
          rm -f "$PUBLISH_DIR/SKILL.md.bak"
          set +e
          OUT=$(npx --yes clawhub@latest skill publish "$PUBLISH_DIR" \
            --slug graph-limitless-mcp \
            --name "Graph Limitless MCP" \
            --version "$VERSION" \
            --tags latest \
            --changelog "v$VERSION — see github.com/${{ github.repository }}" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          # The check above should catch this, but the registry is the authority:
          # if it says the version exists, that is a no-op, not a failure.
          if [ $RC -ne 0 ] && echo "$OUT" | grep -qi "already exists"; then
            echo "Registry reports $VERSION already published — treating as a no-op."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $RC

      - name: Report results
        run: |
          echo "npm publish:     ${{ steps.npm_publish.outcome }}"
          echo "clawhub publish: ${{ steps.clawhub_publish.outcome }}"
          if [ "${{ steps.clawhub_publish.outputs.skipped }}" = "true" ]; then
            echo "ClawHub: version already listed, skipped."
          elif [ "${{ steps.clawhub_publish.outcome }}" != "success" ]; then
            # Do not assume the token: a rejected re-publish of an existing
            # version logs in fine and fails anyway. Read the step log.
            echo "::warning::ClawHub publish did not succeed — see the step log. If it says 'already exists', the version is simply published; if it says login failed, check CLAWHUB_TOKEN."
          fi
          # npm is authoritative: fail the run if it did not publish, so a broken
          # token cannot go unnoticed for weeks the way it did on graph-aave-mcp.
          # "Already published" counts as success — see the publish step.
          if [ "${{ steps.npm_publish.outputs.skipped }}" = "true" ]; then
            echo "npm: version already on the registry, skipped."
          elif [ "${{ steps.npm_publish.outcome }}" != "success" ]; then
            echo "::error::npm publish FAILED. Check the NPM_TOKEN secret is set and is a granular token with read+write on graph-limitless-mcp. (ENEEDAUTH here means the secret is missing or empty.)"
            exit 1
          fi
